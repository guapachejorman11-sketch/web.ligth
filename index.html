<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Para Nahomi — BTS</title>
  <style>
    :root {
      --pink: #ff85b3;
      --rose: #ff4d8d;
      --lilac: #c084fc;
      --glass: rgba(34, 14, 32, 0.72);
      --glass-strong: rgba(255, 244, 249, 0.90);
      --ink-light: #fff7fb;
      --ink-dark: #2a1426;
      --muted-dark: #6b4561;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: "Trebuchet MS", "Segoe UI", system-ui, sans-serif; }
    body {
      min-height: 100vh;
      color: var(--ink-light);
      background-color: #260f22;
      background-image: linear-gradient(180deg, rgba(34, 12, 30, 0.66), rgba(22, 8, 20, 0.82)), url("./mymelody.jpeg");
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      padding: 18px 14px 36px;
    }
    .wrap { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
    .header-note { background: var(--glass); backdrop-filter: blur(10px); border: 1px solid rgba(255, 192, 217, 0.35); border-radius: 18px; padding: 14px 16px; box-shadow: 0 10px 25px rgba(0, 0, 0, 0.35); }
    .header-note h1 { font-size: 1.25rem; margin-bottom: 4px; }
    .header-note p { font-size: 0.92rem; color: #ffe4ef; line-height: 1.35; }
    .now-card { display: none; background: var(--glass-strong); color: var(--ink-dark); backdrop-filter: blur(14px); border: 1px solid rgba(255, 255, 255, 0.75); border-radius: 22px; padding: 16px; box-shadow: 0 16px 36px rgba(0, 0, 0, 0.45); }
    .now-card.active { display: block; }
    .now-top { display: flex; align-items: center; gap: 14px; margin-bottom: 14px; }
    .cover-box { width: 78px; height: 78px; border-radius: 14px; flex-shrink: 0; background: linear-gradient(135deg, #ff9ebb, #c084fc); display: flex; align-items: center; justify-content: center; font-size: 1.7rem; font-weight: 800; color: #fff; }
    .now-meta { min-width: 0; flex: 1; }
    .now-title { font-size: 1.1rem; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .now-sub { font-size: 0.9rem; color: var(--muted-dark); margin-top: 2px; }
    .progress-row { display: flex; align-items: center; gap: 8px; font-size: 0.78rem; font-weight: 700; color: var(--muted-dark); margin-bottom: 12px; }
    .progress-row input[type="range"] { flex: 1; accent-color: var(--rose); cursor: pointer; }
    .transport { display: flex; align-items: center; justify-content: center; gap: 18px; margin-bottom: 12px; }
    .ctrl-btn { background: rgba(255, 77, 141, 0.14); color: var(--ink-dark); border: none; border-radius: 999px; width: 46px; height: 46px; font-size: 1.15rem; font-weight: 800; cursor: pointer; display: grid; place-items: center; }
    .ctrl-btn.main { width: 56px; height: 56px; font-size: 1.3rem; background: linear-gradient(135deg, var(--rose), var(--lilac)); color: #fff; }
    .vol-row { display: flex; align-items: center; gap: 8px; font-size: 0.85rem; color: var(--muted-dark); }
    .vol-row input[type="range"] { flex: 1; accent-color: var(--rose); cursor: pointer; }
    .playlist { display: flex; flex-direction: column; gap: 8px; }
    .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 13px 16px; border-radius: 14px; background: linear-gradient(90deg, rgba(255, 77, 141, 0.66), rgba(147, 51, 234, 0.52)); backdrop-filter: blur(6px); border: 1px solid rgba(255, 255, 255, 0.25); cursor: pointer; }
    .row:nth-child(even) { background: linear-gradient(90deg, rgba(219, 39, 119, 0.60), rgba(59, 130, 246, 0.45)); }
    .row.playing { background: linear-gradient(90deg, rgba(255, 133, 179, 0.92), rgba(192, 132, 252, 0.88)); color: var(--ink-dark); font-weight: 800; border-color: #fff; }
    .row-left { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .row-num { font-size: 0.85rem; opacity: 0.9; width: 24px; flex-shrink: 0; }
    .row-title { font-size: 1rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .row-play { background: rgba(255, 255, 255, 0.24); border: none; color: inherit; width: 34px; height: 34px; border-radius: 50%; font-size: 0.9rem; cursor: pointer; flex-shrink: 0; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="header-note">
      <h1>Para Nahomi</h1>
    </div>
    <section class="now-card" id="nowCard" aria-live="polite">
      <div class="now-top">
        <div class="cover-box" id="coverBadge">BTS</div>
        <div class="now-meta">
          <div class="now-title" id="nowTitle">Canción</div>
          <div class="now-sub">BTS • Para Nahomi</div>
        </div>
      </div>
      <div class="progress-row">
        <span id="curTime">0:00</span>
        <input type="range" id="seekBar" min="0" max="100" value="0" step="0.1" />
        <span id="remTime">-0:00</span>
      </div>
      <div class="transport">
        <button type="button" class="ctrl-btn" id="prevBtn" title="Anterior">⏮</button>
        <button type="button" class="ctrl-btn main" id="playBtn" title="Reproducir / Pausar">▶</button>
        <button type="button" class="ctrl-btn" id="nextBtn" title="Siguiente">⏭</button>
      </div>
      <div class="vol-row">
        <span>🔉</span>
        <input type="range" id="volBar" min="0" max="1" step="0.02" value="0.9" />
        <span>🔊</span>
      </div>
    </section>
    <div class="playlist" id="playlistEl"></div>
  </div>
  <audio id="player" preload="metadata"></audio>
  <script>
    const titles = ["Te amo Nahomi", "Te amo Nahomi", "Te amo Nahomi", "Te amo Nahomi", "Te amo Nahomi", "Te amo Nahomi", "Te amo Nahomi", "Te amo Nahomi", "Te amo Nahomi", "Te amo Nahomi", "Te amo Nahomi", "Te amo Nahomi", "Te amo Nahomi", "Te amo Nahomi", "Te amo Nahomi"];
    const tracks = titles.map((title, i) => ({
      title,
      src: "./audio/" + String(i + 1).padStart(2, "0") + ".mp3"
    }));
    const player = document.getElementById("player");
    const playlistEl = document.getElementById("playlistEl");
    const nowCard = document.getElementById("nowCard");
    const nowTitle = document.getElementById("nowTitle");
    const coverBadge = document.getElementById("coverBadge");
    const playBtn = document.getElementById("playBtn");
    const prevBtn = document.getElementById("prevBtn");
    const nextBtn = document.getElementById("nextBtn");
    const seekBar = document.getElementById("seekBar");
    const volBar = document.getElementById("volBar");
    const curTime = document.getElementById("curTime");
    const remTime = document.getElementById("remTime");
    let currentIndex = -1;

    function fmt(sec) {
      if (!Number.isFinite(sec) || sec < 0) return "0:00";
      const m = Math.floor(sec / 60);
      const s = Math.floor(sec % 60).toString().padStart(2, "0");
      return m + ":" + s;
    }

    function syncUI() {
      playBtn.textContent = (!player.paused && currentIndex !== -1) ? "⏸" : "▶";
      renderList();
    }

    function renderList() {
      playlistEl.innerHTML = "";
      tracks.forEach((t, idx) => {
        const row = document.createElement("div");
        const isCurrent = idx === currentIndex;
        const rowPlaying = isCurrent && !player.paused;
        row.className = "row" + (isCurrent ? " playing" : "");
        row.innerHTML = `
          <div class="row-left">
            <span class="row-num">${String(idx + 1).padStart(2, "0")}</span>
            <span class="row-title">${t.title}</span>
          </div>
          <button type="button" class="row-play" aria-label="Reproducir ${t.title}">${rowPlaying ? "⏸" : "▶"}</button>
        `;
        row.addEventListener("click", () => (currentIndex === idx ? togglePlay() : playTrack(idx)));
        playlistEl.appendChild(row);
      });
    }

    function playTrack(idx) {
      if (!tracks.length) return;
      currentIndex = (idx + tracks.length) % tracks.length;
      const track = tracks[currentIndex];
      nowTitle.textContent = track.title;
      coverBadge.textContent = String(currentIndex + 1).padStart(2, "0");
      nowCard.classList.add("active");
      seekBar.value = 0;
      curTime.textContent = "0:00";
      remTime.textContent = "-0:00";
      player.src = track.src;
      player.load();
      player.play().catch(() => {});
      syncUI();
    }

    function togglePlay() {
      if (currentIndex === -1) return playTrack(0);
      if (player.paused) {
        if (!player.getAttribute("src")) {
          player.src = tracks[currentIndex].src;
          player.load();
        }
        player.play().catch(() => {});
      } else {
        player.pause();
      }
      syncUI();
    }

    playBtn.addEventListener("click", togglePlay);
    prevBtn.addEventListener("click", () => playTrack(currentIndex - 1));
    nextBtn.addEventListener("click", () => playTrack(currentIndex + 1));
    volBar.addEventListener("input", () => { player.volume = Number(volBar.value); });

    player.addEventListener("timeupdate", () => {
      if (!Number.isFinite(player.duration) || player.duration <= 0) return;
      seekBar.value = (player.currentTime / player.duration) * 100;
      curTime.textContent = fmt(player.currentTime);
      remTime.textContent = "-" + fmt(Math.max(0, player.duration - player.currentTime));
    });

    seekBar.addEventListener("input", () => {
      if (!Number.isFinite(player.duration) || player.duration <= 0) return;
      player.currentTime = (Number(seekBar.value) / 100) * player.duration;
    });

    player.addEventListener("play", syncUI);
    player.addEventListener("pause", syncUI);
    player.addEventListener("playing", syncUI);
    player.addEventListener("error", () => {
      nowTitle.textContent = "Error al cargar " + (tracks[currentIndex] ? tracks[currentIndex].src : "");
      syncUI();
    });
    player.addEventListener("ended", () => playTrack(currentIndex + 1));

    renderList();
  </script>
</body>
</html>
